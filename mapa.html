<!DOCTYPE html>
<html>
<head>
    <title>Mapa de Sensores - Novos vs Existentes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map("map").setView([-3.05, -60.0], 12);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "© OpenStreetMap"
        }).addTo(map);

        // Dados existentes
        var existentes = [
            {name: "SENSOR - 163", lat: -3.0905525365499, lon: -59.96662355581251},
            {name: "SENSOR 96", lat: -3.074822972873588, lon: -60.00851999710629},
            {name: "SENSOR 164", lat: -3.082103095883225, lon: -60.02338827206129},
            {name: "SENSOR - 152", lat: -3.089325488284845, lon: -59.96505207964709},
            {name: "SENSOR - 151", lat: -3.130056929220237, lon: -60.0267688431699},
            {name: "SENSOR - 158", lat: -3.12840401786127, lon: -59.98678141769486},
            {name: "SENSOR - 133", lat: -3.136189555741155, lon: -59.94962581646421},
            {name: "SENSOR - 163", lat: -3.016426262944961, lon: -59.86327599069013},
            {name: "SENSOR - 156", lat: -3.095104096128444, lon: -59.98658647645122},
            {name: "SENSOR 160", lat: -3.073271791726624, lon: -59.99316481854378},
        ];

        var novos = [
            {name: "PONTO 1 - SENSOR", lat: -3.067939910835975, lon: -60.02538311691958},
            {name: "PONTO 2 - SENSOR", lat: -3.098685234568674, lon: -60.01768030322979},
            {name: "PONTO 3 - SENSOR", lat: -3.078671878693257, lon: -60.05105093751735},
            {name: "PONTO 4 - SESNOR", lat: -3.10845455803873, lon: -60.05728518920576},
            {name: "PONTO 5 - SENSOR", lat: -2.990741881775028, lon: -60.0173670690685},
            {name: "PONTO 6 - SENSOR", lat: -3.007664128499856, lon: -60.04865450094506},
            {name: "PONTO 7 - SENSOR", lat: -2.966072973950594, lon: -59.92356805100188},
            {name: "PONTO 8 - SENSOR", lat: -3.029045590153492, lon: -59.91641648537352},
            {name: "PONTO 9 - SENSOR", lat: -3.064092840886889, lon: -60.101780158165},
            {name: "PONTO 10 - SENSOR", lat: -3.056215300311479, lon: -59.85065969815109},
            {name: "PONTO 11 - SENSOR", lat: -3.078116973026803, lon: -59.8833642452505},
            {name: "PONTO 12 - SENSOR", lat: -3.060067598852792, lon: -59.87736830050749},
            {name: "PONTO 13 - SENSOR", lat: -3.026620722502805, lon: -59.99627300009421},
            {name: "PONTO 14 - SENSOR", lat: -3.020963921666585, lon: -59.9631647428046},
            {name: "PONTO 15 - SENSOR", lat: -3.053358838505912, lon: -59.9469934751597},
        ];

        existentes.forEach(function(s) {
            L.circleMarker([s.lat, s.lon], {
                radius: 8,
                color: "blue",
                fillColor: "blue",
                fillOpacity: 0.8
            }).bindPopup("<b>Existente:</b> " + s.name).addTo(map);
        });

        novos.forEach(function(s) {
            L.circleMarker([s.lat, s.lon], {
                radius: 10,
                color: "red",
                fillColor: "red",
                fillOpacity: 0.9
            }).bindPopup("<b>Novo:</b> " + s.name).addTo(map);
        });
    </script>
</body>
</html>
